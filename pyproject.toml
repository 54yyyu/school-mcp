[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "school-mcp"
version = "0.1.0"
description = "MCP Server for School-related functionalities"
requires-python = ">=3.8"
dependencies = [
    "mcp>=1.2.0",
    "canvasapi",
    "gradescopeapi",
    "pandas",
    "pytz",
    "httpx",
    "tqdm",
    "python-dotenv",
    "click>=8.0",
    "requests",
]

[project.scripts]
coursework = "school_mcp.cli:main"
cw = "school_mcp.cli:main"
school-mcp = "school_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["school_mcp"]
